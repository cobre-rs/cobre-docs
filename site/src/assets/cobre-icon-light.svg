<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- LIGHT-MODE variant of cobre-icon.svg, derived for the docs-site header
       (cobre-docs ticket-011b). The brand ships only the dark-tiled icon; on a
       light header that dark tile reads heavy. This variant keeps the exact
       geometry but swaps to a light brand-surface tile (#F0EDE8) and anchors the
       copper on the readable mid/dark range (#B87333->#8B5E3C) — the original's
       lighter gradient stops (#D4956A/#E8B88A) wash out on a light tile. All hexes
       are from BRAND-GUIDELINES.md. Pairs with cobre-icon.svg via Starlight
       logo:{light,dark}. (Derived asset — pending brand-owner blessing / an
       official light icon.) -->
  <defs>
    <linearGradient id="copperL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B87333"/>
      <stop offset="100%" style="stop-color:#8B5E3C"/>
    </linearGradient>
  </defs>

  <!-- Light surface tile -->
  <rect width="128" height="128" fill="#F0EDE8" rx="24"/>

  <!-- Conductor bars + busbar icon, centered (geometry identical to the dark icon) -->
  <g transform="translate(22, 20)">
    <rect x="10" y="14" width="62" height="7" rx="3.5" fill="url(#copperL)"/>
    <rect x="10" y="44" width="62" height="7" rx="3.5" fill="url(#copperL)"/>
    <rect x="10" y="74" width="62" height="7" rx="3.5" fill="url(#copperL)"/>

    <!-- Vertical connector left -->
    <rect x="10" y="14" width="7" height="67" rx="3.5" fill="#B87333"/>

    <!-- Node dots -->
    <circle cx="72" cy="17.5" r="6.5" fill="url(#copperL)"/>
    <circle cx="72" cy="47.5" r="6.5" fill="url(#copperL)"/>
    <circle cx="72" cy="77.5" r="6.5" fill="url(#copperL)"/>

    <!-- Spark accent (brand Spark Amber) -->
    <path d="M 80 42 L 88 36 L 84 46 L 92 40" stroke="#F5A623" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
