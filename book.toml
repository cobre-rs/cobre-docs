[book]
title = "Cobre Methodology Reference"
description = "Open infrastructure for power system computation"
authors = ["Rogerio J. M. Alves"]
language = "en"
src = "src"

[build]
build-dir = "book"

[preprocessor.katex]
after = ["links"]
throw-on-error = true

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/cobre-rs/cobre-docs"
edit-url-template = "https://github.com/cobre-rs/cobre-docs/edit/main/{path}"
site-url = "/"
additional-css = ["theme/css/custom.css"]
no-section-label = false
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20

[output.html.playground]
editable = false
