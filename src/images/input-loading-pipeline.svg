<svg width="100%" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .label { font-size: 11px; fill: #444; }
  .small { font-size: 9.5px; fill: #666; }
  .mono { font-size: 9.5px; font-family: monospace; }
  .note { font-size: 10px; fill: #666; font-style: italic; }
</style>

<text class="title" x="360" y="22" text-anchor="middle">Input loading pipeline</text>

<!-- Rank 0 column -->
<rect x="40" y="40" width="400" height="370" rx="10" fill="#FAFAFA" stroke="#DDD" stroke-width="0.5"/>
<text class="label" x="240" y="60" text-anchor="middle" fill="#0F6E56" font-weight="600">Rank 0 — sequential load + validate</text>

<!-- Step 1: Config -->
<rect x="60" y="72" width="180" height="32" rx="6" fill="#FDF6F0" stroke="#B87333" stroke-width="0.8"/>
<text class="mono" x="70" y="92" fill="#8B5E3C">config.json</text>
<text class="small" x="180" y="92">schema + parse</text>

<line x1="150" y1="104" x2="150" y2="116" stroke="#888" stroke-width="1" marker-end="url(#arr)" stroke="#888"/>

<!-- Step 2: Stages -->
<rect x="60" y="118" width="180" height="32" rx="6" fill="#FDF6F0" stroke="#B87333" stroke-width="0.8"/>
<text class="mono" x="70" y="138" fill="#8B5E3C">stages.json</text>
<text class="small" x="165" y="138">branching, noise</text>

<line x1="150" y1="150" x2="150" y2="162" stroke="#888" stroke-width="1" marker-end="url(#arr)" stroke="#888"/>

<!-- Step 3: System entities -->
<rect x="60" y="164" width="360" height="72" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="label" x="70" y="182" fill="#085041" font-weight="500">System entities (dependency order)</text>
<text class="mono" x="80" y="198" fill="#085041">buses → lines → hydros → thermals → ncs</text>
<text class="small" x="80" y="214" fill="#0F6E56">Each: schema validate → cross-ref previous → build lookup index</text>
<text class="small" x="80" y="228" fill="#0F6E56">Cascade topology built after hydros; line refs validated against buses</text>

<line x1="150" y1="236" x2="150" y2="248" stroke="#888" stroke-width="1" marker-end="url(#arr)" stroke="#888"/>

<!-- Step 4: Scenarios -->
<rect x="60" y="250" width="360" height="52" rx="6" fill="#EBF5FB" stroke="#4A90B8" stroke-width="0.8"/>
<text class="label" x="70" y="268" fill="#2C6D8C" font-weight="500">Stochastic data</text>
<text class="mono" x="80" y="284" fill="#2C6D8C">seasonal_stats → ar_coefficients → correlation → external/</text>
<text class="small" x="80" y="296" fill="#4A90B8">PAR fit (if history present) or load precomputed params</text>

<line x1="150" y1="302" x2="150" y2="314" stroke="#888" stroke-width="1" marker-end="url(#arr)" stroke="#888"/>

<!-- Step 5: Constraints -->
<rect x="60" y="316" width="360" height="32" rx="6" fill="#FFF8E1" stroke="#F5A623" stroke-width="0.8"/>
<text class="label" x="70" y="336" fill="#8B6914" font-weight="500">Constraints</text>
<text class="mono" x="200" y="336" fill="#8B6914">generic_constraints + coefficients</text>

<line x1="150" y1="348" x2="150" y2="360" stroke="#888" stroke-width="1" marker-end="url(#arr)" stroke="#888"/>

<!-- Validated System -->
<rect x="100" y="362" width="200" height="34" rx="8" fill="#0F6E56"/>
<text class="label" x="200" y="383" text-anchor="middle" fill="#fff" font-weight="600">Validated System</text>

<!-- All Ranks column -->
<rect x="490" y="40" width="200" height="370" rx="10" fill="#FAFAFA" stroke="#DDD" stroke-width="0.5"/>
<text class="label" x="590" y="60" text-anchor="middle" fill="#534AB7" font-weight="600">All Ranks</text>

<!-- Broadcast arrow -->
<line x1="300" y1="379" x2="490" y2="200" stroke="#534AB7" stroke-width="2" marker-end="url(#arr)" stroke="#534AB7"/>
<text class="label" x="410" y="268" fill="#534AB7" font-weight="500" transform="rotate(-25,410,268)">broadcast</text>

<!-- Rank boxes -->
<rect x="510" y="100" width="160" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="small" x="590" y="116" text-anchor="middle" fill="#3C3489">Rank 0: allocate workspaces</text>
<text class="small" x="590" y="130" text-anchor="middle" fill="#3C3489">setup solvers</text>

<rect x="510" y="160" width="160" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="small" x="590" y="176" text-anchor="middle" fill="#3C3489">Rank 1: receive System</text>
<text class="small" x="590" y="190" text-anchor="middle" fill="#3C3489">allocate, setup</text>

<rect x="510" y="220" width="160" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="small" x="590" y="236" text-anchor="middle" fill="#3C3489">Rank 2: receive System</text>
<text class="small" x="590" y="250" text-anchor="middle" fill="#3C3489">allocate, setup</text>

<rect x="510" y="280" width="160" height="30" rx="6" fill="#F5F5F5" stroke="#999" stroke-width="0.5" stroke-dasharray="3,2"/>
<text class="small" x="590" y="300" text-anchor="middle">…</text>

<!-- Exception note -->
<rect x="510" y="330" width="160" height="64" rx="6" fill="#FFF0ED" stroke="#993C1D" stroke-width="0.5"/>
<text class="small" x="590" y="346" text-anchor="middle" fill="#993C1D" font-weight="500">Exception:</text>
<text class="small" x="590" y="360" text-anchor="middle" fill="#993C1D">Policy warm-start</text>
<text class="small" x="590" y="374" text-anchor="middle" fill="#993C1D">loaded in parallel</text>
<text class="small" x="590" y="388" text-anchor="middle" fill="#993C1D">(all ranks read)</text>

<!-- Bottom note -->
<text class="note" x="360" y="430" text-anchor="middle">Fail-fast: first validation error aborts the pipeline. All ranks receive identical validated data.</text>
</svg>
