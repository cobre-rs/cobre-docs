<svg width="100%" viewBox="0 0 740 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .gate { font-size: 11px; font-weight: 600; fill: #fff; }
  .example { font-size: 8.5px; fill: #666; font-style: italic; }
  .fail { font-size: 9px; fill: #DC4C4C; font-weight: 500; }
  .small { font-size: 9px; fill: #666; }
  .note { font-size: 9.5px; fill: #666; font-style: italic; }
</style>

<text class="title" x="370" y="22" text-anchor="middle">Validation layers — fail-fast pipeline</text>

<!-- Gate 1: Structural -->
<rect x="20" y="44" width="120" height="52" rx="8" fill="#4A90B8"/>
<text class="gate" x="80" y="66" text-anchor="middle">1. Structural</text>
<text class="gate" x="80" y="80" text-anchor="middle" font-size="9px" font-weight="400">file existence</text>

<line x1="140" y1="70" x2="160" y2="70" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)" stroke="#0F6E56"/>

<!-- Gate 2: Schema -->
<rect x="162" y="44" width="120" height="52" rx="8" fill="#0F6E56"/>
<text class="gate" x="222" y="66" text-anchor="middle">2. Schema</text>
<text class="gate" x="222" y="80" text-anchor="middle" font-size="9px" font-weight="400">types, ranges</text>

<line x1="282" y1="70" x2="302" y2="70" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)" stroke="#0F6E56"/>

<!-- Gate 3: Referential -->
<rect x="304" y="44" width="120" height="52" rx="8" fill="#534AB7"/>
<text class="gate" x="364" y="66" text-anchor="middle">3. Referential</text>
<text class="gate" x="364" y="80" text-anchor="middle" font-size="9px" font-weight="400">cross-refs</text>

<line x1="424" y1="70" x2="444" y2="70" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)" stroke="#0F6E56"/>

<!-- Gate 4: Dimensional -->
<rect x="446" y="44" width="120" height="52" rx="8" fill="#F5A623"/>
<text class="gate" x="506" y="66" text-anchor="middle" fill="#fff">4. Dimensional</text>
<text class="gate" x="506" y="80" text-anchor="middle" font-size="9px" font-weight="400" fill="#fff">array lengths</text>

<line x1="566" y1="70" x2="586" y2="70" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)" stroke="#0F6E56"/>

<!-- Gate 5: Semantic -->
<rect x="588" y="44" width="120" height="52" rx="8" fill="#B87333"/>
<text class="gate" x="648" y="66" text-anchor="middle">5. Semantic</text>
<text class="gate" x="648" y="80" text-anchor="middle" font-size="9px" font-weight="400">domain logic</text>

<!-- Pass arrow -->
<line x1="648" y1="96" x2="648" y2="120" stroke="#0F6E56" stroke-width="2" marker-end="url(#arr)" stroke="#0F6E56"/>
<rect x="598" y="122" width="100" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="gate" x="648" y="140" text-anchor="middle" fill="#085041" font-size="10px">✓ Valid</text>

<!-- Fail arrows (down from each gate) -->
<line x1="80" y1="96" x2="80" y2="160" stroke="#DC4C4C" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)" stroke="#DC4C4C"/>
<text class="fail" x="80" y="174" text-anchor="middle">ABORT</text>
<text class="example" x="80" y="188" text-anchor="middle">config.json</text>
<text class="example" x="80" y="200" text-anchor="middle">not found</text>

<line x1="222" y1="96" x2="222" y2="160" stroke="#DC4C4C" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)" stroke="#DC4C4C"/>
<text class="fail" x="222" y="174" text-anchor="middle">ABORT</text>
<text class="example" x="222" y="188" text-anchor="middle">bus_id: expected</text>
<text class="example" x="222" y="200" text-anchor="middle">u32, got string</text>

<line x1="364" y1="96" x2="364" y2="160" stroke="#DC4C4C" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)" stroke="#DC4C4C"/>
<text class="fail" x="364" y="174" text-anchor="middle">ABORT</text>
<text class="example" x="364" y="188" text-anchor="middle">hydro.bus_id=99</text>
<text class="example" x="364" y="200" text-anchor="middle">not in buses</text>

<line x1="506" y1="96" x2="506" y2="160" stroke="#DC4C4C" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)" stroke="#DC4C4C"/>
<text class="fail" x="506" y="174" text-anchor="middle">ABORT</text>
<text class="example" x="506" y="188" text-anchor="middle">FPHA: 3 blocks</text>
<text class="example" x="506" y="200" text-anchor="middle">but 5 coefficients</text>

<line x1="648" y1="96" x2="648" y2="96" stroke="none"/><!-- spacer -->

<!-- Semantic example on the valid side -->
<text class="example" x="648" y="158" text-anchor="middle">cascade cycle</text>
<text class="example" x="648" y="170" text-anchor="middle">detected (warn)</text>

<!-- Bottom -->
<text class="note" x="370" y="230" text-anchor="middle">Fail-fast: if any layer fails, subsequent layers do not run. Errors are collected within each layer.</text>
<text class="note" x="370" y="246" text-anchor="middle">All validation runs on rank 0 only. Validated System is then broadcast to all ranks.</text>
</svg>
