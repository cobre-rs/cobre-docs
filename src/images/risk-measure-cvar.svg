<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100%"
   viewBox="0 0 680 320"
   version="1.1"
   id="svg21"
   sodipodi:docname="risk-measure-cvar.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs21" />
  <sodipodi:namedview
     id="namedview21"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.5632621"
     inkscape:cx="389.34762"
     inkscape:cy="170.48588"
     inkscape:window-width="3440"
     inkscape:window-height="1371"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg21" />
  <style
     id="style1">
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .axis { font-size: 10px; fill: #888; }
  .label { font-size: 10.5px; fill: #444; }
  .small { font-size: 9px; fill: #666; }
  .math { font-size: 10px; font-family: serif; font-style: italic; fill: #333; }
  .note { font-size: 9.5px; fill: #666; font-style: italic; }
</style>
  <text
     class="title"
     x="340"
     y="22"
     text-anchor="middle"
     id="text1">Risk measures: expectation vs CVaR</text>
  <!-- Axes -->
  <line
     x1="70"
     y1="240"
     x2="600"
     y2="240"
     stroke="#999"
     stroke-width="0.8"
     id="line1" />
  <line
     x1="70"
     y1="240"
     x2="70"
     y2="40"
     stroke="#999"
     stroke-width="0.8"
     id="line2" />
  <text
     class="axis"
     x="344.29138"
     y="285.89651"
     text-anchor="middle"
     id="text2">Total cost C</text>
  <text
     class="axis"
     x="-140.39012"
     y="52.699078"
     text-anchor="middle"
     transform="rotate(-90)"
     id="text3">Probability density</text>
  <!-- Cost distribution (right-skewed) -->
  <path
     d="M100,240 Q120,238 150,220 Q170,190 200,140 Q220,100 250,70 Q270,58 300,60 Q330,65 360,80 Q400,110 440,155 Q470,185 500,210 Q530,228 560,238 L560,240 Z"
     fill="#4A90B8"
     fill-opacity="0.12"
     stroke="#4A90B8"
     stroke-width="1.5"
     id="path3" />
  <!-- E[C] line -->
  <line
     x1="310"
     y1="240"
     x2="310"
     y2="50"
     stroke="#0F6E56"
     stroke-width="2"
     stroke-dasharray="5,3"
     id="line3" />
  <text
     class="label"
     x="311.56052"
     y="252.88373"
     text-anchor="middle"
     fill="#0F6E56"
     font-weight="500"
     id="text4">E[C]</text>
  <text
     class="small"
     x="311.56052"
     y="264.88373"
     text-anchor="middle"
     fill="#0F6E56"
     id="text5">expected cost</text>
  <!-- Alpha quantile -->
  <line
     x1="430"
     y1="240"
     x2="430"
     y2="50"
     stroke="#993C1D"
     stroke-width="1.5"
     stroke-dasharray="4,3"
     id="line5" />
  <text
     class="math"
     x="430.39014"
     y="250.54297"
     text-anchor="middle"
     fill="#993C1D"
     id="text6">VaR_α</text>
  <text
     class="small"
     x="430.39014"
     y="262.54297"
     text-anchor="middle"
     fill="#993C1D"
     id="text7">α-quantile</text>
  <!-- Tail shading (CVaR region) -->
  <path
     d="M430,240 L430,145 Q450,165 470,185 Q500,210 530,228 Q540,233 560,238 L560,240 Z"
     fill="#993C1D"
     fill-opacity="0.20"
     id="path7" />
  <!-- CVaR label -->
  <text
     class="label"
     x="443.67825"
     y="123.53493"
     fill="#993C1D"
     font-weight="500"
     id="text8">CVaR_α</text>
  <text
     class="small"
     x="483.86142"
     y="122.31994"
     fill="#993C1D"
     id="text9">= E[C | C ≥ VaR_α]</text>
  <!-- Alpha annotation -->
  <path
     d="m 429.65923,111.011 h 128"
     fill="none"
     stroke="#993c1d"
     stroke-width="0.8"
     id="path9" />
  <text
     class="small"
     x="496.78024"
     y="105.06036"
     text-anchor="middle"
     fill="#993C1D"
     id="text10">(1−α) tail</text>
  <!-- Convex combination formula -->
  <rect
     x="83.901276"
     y="292.48886"
     width="500"
     height="22"
     rx="4"
     fill="#eeedfe"
     stroke="#534ab7"
     stroke-width="0.5"
     id="rect10" />
  <text
     class="math"
     x="333.90128"
     y="307.48886"
     text-anchor="middle"
     fill="#3C3489"
     font-size="11px"
     id="text11">ρ(C) = λ · CVaR_α(C) + (1 − λ) · E[C] where λ ∈ [0,1] controls risk aversion</text>
  <!-- Right-side annotations -->
  <rect
     x="581.12744"
     y="41.230953"
     width="69.409042"
     height="62.283257"
     rx="4.6272693"
     fill="#f8f8f8"
     stroke="#dddddd"
     stroke-width="0.414184"
     id="rect11" />
  <text
     class="small"
     x="615.24677"
     y="55.372581"
     text-anchor="middle"
     fill="#333"
     font-weight="500"
     id="text12">Parameters</text>
  <text
     class="math"
     x="595.85187"
     y="75.323219"
     fill="#534AB7"
     id="text13">α ∈ (0,1)</text>
  <text
     class="math"
     x="596.242"
     y="90.058876"
     fill="#534AB7"
     id="text15">λ ∈ [0,1]</text>
  <!-- Risk-neutral vs risk-averse -->
  <rect
     x="569.41809"
     y="117.13143"
     width="90.096947"
     height="53.227486"
     rx="6.0064631"
     fill="#f8f8f8"
     stroke="#dddddd"
     stroke-width="0.403055"
     id="rect16" />
  <text
     class="small"
     x="614.46655"
     y="128.15759"
     text-anchor="middle"
     fill="#333"
     font-weight="500"
     id="text17">Special cases</text>
  <text
     class="small"
     x="579.46655"
     y="146.15759"
     fill="#0F6E56"
     id="text18">λ = 0:</text>
  <text
     class="small"
     x="604.71338"
     y="146.06363"
     fill="#0F6E56"
     id="text19">risk-neutral</text>
  <text
     class="small"
     x="579.85669"
     y="161.72285"
     fill="#993C1D"
     id="text20">λ = 1:</text>
  <text
     class="small"
     x="605.10352"
     y="161.62889"
     fill="#993C1D"
     id="text21">pure CVaR</text>
</svg>
