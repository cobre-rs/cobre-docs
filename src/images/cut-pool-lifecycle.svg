<svg width="100%" viewBox="0 0 740 380" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .sub { font-size: 12px; font-weight: 500; fill: #444; }
  .label { font-size: 10.5px; fill: #333; }
  .small { font-size: 9px; fill: #666; }
  .mono { font-size: 9px; font-family: monospace; }
  .note { font-size: 9.5px; fill: #666; font-style: italic; }
</style>

<text class="title" x="370" y="22" text-anchor="middle">Cut pool: lifecycle and memory layout</text>

<!-- === LEFT: State machine === -->
<text class="sub" x="180" y="48" text-anchor="middle">Cut lifecycle (state machine)</text>

<!-- Generated -->
<rect x="110" y="60" width="140" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="label" x="180" y="82" text-anchor="middle" fill="#3C3489" font-weight="500">Generated</text>

<line x1="180" y1="94" x2="180" y2="120" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)" stroke="#0F6E56"/>
<text class="small" x="190" y="110" fill="#0F6E56">add to LP</text>

<!-- Active -->
<rect x="110" y="122" width="140" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="label" x="180" y="144" text-anchor="middle" fill="#085041" font-weight="600">Active (in LP)</text>

<line x1="180" y1="156" x2="180" y2="182" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arr)" stroke="#993C1D"/>
<text class="small" x="190" y="172" fill="#993C1D">selection removes</text>

<!-- Deactivated -->
<rect x="110" y="184" width="140" height="34" rx="8" fill="#F5F5F5" stroke="#999" stroke-width="1"/>
<text class="label" x="180" y="206" text-anchor="middle" fill="#666">Deactivated</text>
<text class="small" x="180" y="218" text-anchor="middle" fill="#888">(retained in pool)</text>

<!-- Re-activate arrow -->
<path d="M250,196 Q300,196 300,144 Q300,130 250,130" fill="none" stroke="#4A90B8" stroke-width="1" marker-end="url(#arr)" stroke="#4A90B8" stroke-dasharray="4,2"/>
<text class="small" x="310" y="168" fill="#4A90B8">re-activate</text>

<!-- Never deleted note -->
<rect x="80" y="246" width="200" height="24" rx="4" fill="#FFF0ED" stroke="#993C1D" stroke-width="0.5"/>
<text class="small" x="180" y="262" text-anchor="middle" fill="#993C1D" font-weight="500">Never deleted — pool only grows</text>

<!-- Warm-start arrow -->
<rect x="80" y="280" width="200" height="30" rx="4" fill="#FFF8E1" stroke="#F5A623" stroke-width="0.5"/>
<text class="small" x="180" y="296" text-anchor="middle" fill="#8B6914">Warm-start: load from checkpoint</text>
<text class="small" x="180" y="306" text-anchor="middle" fill="#8B6914">→ all loaded cuts start Active</text>

<!-- === RIGHT: Memory layout === -->
<text class="sub" x="540" y="48" text-anchor="middle">Pre-allocated cut pool (flat array)</text>

<!-- Pool rectangle -->
<rect x="380" y="60" width="340" height="200" rx="8" fill="#FAFAFA" stroke="#DDD" stroke-width="0.5"/>

<!-- Slot array -->
<text class="label" x="395" y="82" fill="#333" font-weight="500">Coefficient storage (dense, contiguous)</text>

<!-- Slots -->
<rect x="395" y="90" width="50" height="28" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="mono" x="420" y="108" text-anchor="middle" fill="#085041">slot 0</text>
<rect x="450" y="90" width="50" height="28" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="mono" x="475" y="108" text-anchor="middle" fill="#085041">slot 1</text>
<rect x="505" y="90" width="50" height="28" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="mono" x="530" y="108" text-anchor="middle" fill="#085041">slot 2</text>
<rect x="560" y="90" width="50" height="28" rx="2" fill="#F5F5F5" stroke="#999" stroke-width="0.8" stroke-dasharray="2,2"/>
<text class="mono" x="585" y="108" text-anchor="middle" fill="#888">slot 3</text>
<rect x="615" y="90" width="50" height="28" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="mono" x="640" y="108" text-anchor="middle" fill="#085041">slot 4</text>
<rect x="670" y="90" width="40" height="28" rx="2" fill="#F8F8F8" stroke="#CCC" stroke-width="0.5"/>
<text class="mono" x="690" y="108" text-anchor="middle" fill="#CCC">…</text>

<!-- Activity bitmap -->
<text class="label" x="395" y="142" fill="#333" font-weight="500">Activity bitmap</text>
<rect x="395" y="150" width="50" height="18" rx="2" fill="#0F6E56"/>
<text class="mono" x="420" y="163" text-anchor="middle" fill="#fff">1</text>
<rect x="450" y="150" width="50" height="18" rx="2" fill="#0F6E56"/>
<text class="mono" x="475" y="163" text-anchor="middle" fill="#fff">1</text>
<rect x="505" y="150" width="50" height="18" rx="2" fill="#0F6E56"/>
<text class="mono" x="530" y="163" text-anchor="middle" fill="#fff">1</text>
<rect x="560" y="150" width="50" height="18" rx="2" fill="#999"/>
<text class="mono" x="585" y="163" text-anchor="middle" fill="#fff">0</text>
<rect x="615" y="150" width="50" height="18" rx="2" fill="#0F6E56"/>
<text class="mono" x="640" y="163" text-anchor="middle" fill="#fff">1</text>

<!-- Slot formula -->
<text class="label" x="395" y="196" fill="#333" font-weight="500">Slot assignment (deterministic)</text>
<rect x="395" y="204" width="310" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="mono" x="550" y="219" text-anchor="middle" fill="#3C3489">slot = warm_start + iter × M + fwd_idx</text>

<!-- Metadata -->
<text class="label" x="395" y="248" fill="#333" font-weight="500">Per-cut metadata</text>
<text class="mono" x="395" y="262">(iteration, stage, forward_pass, rhs, coefficients[])</text>

<!-- Bottom note -->
<text class="note" x="370" y="300" text-anchor="middle">Only active cuts are added to the solver LP via addRows. Deactivated cuts remain in pool for possible re-activation.</text>
<text class="note" x="370" y="314" text-anchor="middle">Deterministic slot assignment enables lock-free concurrent writes from multiple threads.</text>
</svg>
