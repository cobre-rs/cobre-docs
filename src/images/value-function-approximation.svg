<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100%"
   viewBox="0 0 760 440"
   version="1.1"
   id="svg21"
   sodipodi:docname="value-function-approximation.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs21" />
  <sodipodi:namedview
     id="namedview21"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.6363636"
     inkscape:cx="380.06897"
     inkscape:cy="189.65517"
     inkscape:window-width="3440"
     inkscape:window-height="1371"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg21" />
  <style
     id="style1">
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
  .sub { font-size: 11px; fill: #888; }
  .axis { font-size: 11px; fill: #555; font-style: italic; }
  .label { font-size: 10px; fill: #993C1D; }
  .note { font-size: 10px; fill: #555; }
</style>
  <text
     class="title"
     x="380"
     y="24"
     text-anchor="middle"
     id="text1">Value function approximation via Benders cuts</text>
  <!-- ======== LEFT PANEL: 2 cuts ======== -->
  <rect
     x="16"
     y="40"
     width="352"
     height="356"
     rx="12"
     fill="#FAFAFA"
     stroke="#DDD"
     stroke-width="0.5"
     id="rect1" />
  <text
     class="sub"
     x="196.17241"
     y="59.896553"
     text-anchor="middle"
     id="text2">Iteration k — 2 cuts</text>
  <!-- Axes -->
  <line
     x1="56"
     y1="340"
     x2="342"
     y2="340"
     stroke="#AAA"
     stroke-width="0.8"
     id="line2" />
  <line
     x1="56"
     y1="340"
     x2="56"
     y2="70"
     stroke="#AAA"
     stroke-width="0.8"
     id="line3" />
  <!-- Arrow tips -->
  <polygon
     points="342,340 336,337 336,343"
     fill="#AAA"
     id="polygon3" />
  <polygon
     points="56,70 53,76 59,76"
     fill="#AAA"
     id="polygon4" />
  <text
     class="axis"
     x="200"
     y="370"
     text-anchor="middle"
     id="text4">storage v</text>
  <text
     class="axis"
     x="-205"
     y="31.862068"
     text-anchor="middle"
     transform="rotate(-90)"
     id="text5">cost-to-go Q(v)</text>
  <!--
  Q(v): convex ∪ shape. In SVG y-coords (y↓), the curve forms a valley.
  High Q = small y (top), low Q = large y (bottom).
  Minimum at approximately (200, 300). Rises to ~130 at edges.
-->
  <path
     id="QL"
     d="M72,130 Q105,175 130,220 Q155,265 180,290 Q200,304 215,300 Q240,288 260,260 Q285,220 310,175 Q325,148 340,128"
     fill="none"
     stroke="#1a1a1a"
     stroke-width="2.5"
     stroke-linecap="round" />
  <text
     class="note"
     x="338"
     y="120"
     fill="#1a1a1a"
     font-weight="600"
     font-size="12px"
     id="text6">Q(v)</text>
  <!-- Trial point A: left side at (125, 228) — on the curve, going downhill -->
  <circle
     cx="148.13792"
     cy="252.27586"
     r="5"
     fill="#0f6e56"
     id="circle6" />
  <!-- Cut A: tangent at trial point A.
     The curve slopes downward (in chart) = positive dy/dx in SVG.
     Tangent passes through (125,228), slope≈+0.9 in SVG.
     y = 228 + 0.9*(x-125) = 0.9x + 115.5
     At x=72: y=180.3  At x=340: y=421.5 (clip)
-->
  <line
     x1="80.251274"
     y1="160.94353"
     x2="228.16251"
     y2="356.53922"
     stroke="#993c1d"
     stroke-width="0.808965"
     stroke-dasharray="6, 3"
     opacity="0.8"
     id="line6" />
  <text
     class="label"
     x="62.241379"
     y="175.13792"
     id="text7">cut 1</text>
  <!-- Trial point B: right side at (280, 232) — on the curve, going uphill -->
  <circle
     cx="271.65518"
     cy="239.96552"
     r="5"
     fill="#0f6e56"
     id="circle7" />
  <!-- Cut B: tangent at trial point B.
     The curve slopes upward (in chart) = negative dy/dx in SVG.
     Tangent passes through (280,232), slope≈-0.8 in SVG.
     y = 232 - 0.8*(x-280) = -0.8x + 456
     At x=72: y=398.4  At x=340: y=184
-->
  <line
     x1="205.34221"
     y1="356.01855"
     x2="316.19681"
     y2="164.54918"
     stroke="#993c1d"
     stroke-width="1.05251"
     stroke-dasharray="6, 3"
     opacity="0.8"
     id="line7" />
  <text
     class="label"
     x="319.3793"
     y="176.58621"
     id="text8">cut 2</text>
  <!-- Outer approximation: piecewise max of cuts = min y in SVG.
     Cuts intersect: 0.9x+115.5 = -0.8x+456 → 1.7x=340.5 → x≈200, y≈295.5
     Left of x=200: cut A has smaller y → cut A dominates
     Right of x=200: cut B has smaller y → cut B dominates
-->
  <path
     d="M 91.344828,177.34483 214.41379,338.86207 311.93103,173"
     fill="none"
     stroke="#534ab7"
     stroke-width="2.2"
     stroke-linecap="round"
     id="path8"
     sodipodi:nodetypes="ccc" />
  <!-- Gap shading: between Q and outer approximation -->
  <!-- Legend -->
  <circle
     cx="79.689651"
     cy="382.31033"
     r="4"
     fill="#0f6e56"
     id="circle9" />
  <text
     class="note"
     x="89.689651"
     y="386.31033"
     font-size="9px"
     id="text10">trial point (on Q)</text>
  <line
     x1="175.68965"
     y1="382.31033"
     x2="201.68965"
     y2="382.31033"
     stroke="#534ab7"
     stroke-width="2.2"
     id="line10" />
  <text
     class="note"
     x="207.68965"
     y="386.31033"
     font-size="9px"
     id="text11">outer approx (lower bound)</text>
  <!-- ======== RIGHT PANEL: 3 cuts (+1 new) ======== -->
  <rect
     x="392"
     y="40"
     width="352"
     height="356"
     rx="12"
     fill="#FAFAFA"
     stroke="#DDD"
     stroke-width="0.5"
     id="rect11" />
  <text
     class="sub"
     x="577.48279"
     y="59.137932"
     text-anchor="middle"
     id="text12">Iteration k+1 — 3 cuts (+1 new)</text>
  <!-- Axes -->
  <line
     x1="432"
     y1="340"
     x2="718"
     y2="340"
     stroke="#AAA"
     stroke-width="0.8"
     id="line12" />
  <line
     x1="432"
     y1="340"
     x2="432"
     y2="70"
     stroke="#AAA"
     stroke-width="0.8"
     id="line13" />
  <polygon
     points="718,340 712,337 712,343"
     fill="#AAA"
     id="polygon13" />
  <polygon
     points="432,70 429,76 435,76"
     fill="#AAA"
     id="polygon14" />
  <text
     class="axis"
     x="579.03448"
     y="367.72415"
     text-anchor="middle"
     id="text14">storage v</text>
  <!-- Q(v): same shape, shifted by 376 px -->
  <path
     d="M448,130 Q481,175 506,220 Q531,265 556,290 Q576,304 591,300 Q616,288 636,260 Q661,220 686,175 Q701,148 716,128"
     fill="none"
     stroke="#1a1a1a"
     stroke-width="2.5"
     stroke-linecap="round"
     id="path14" />
  <text
     class="note"
     x="714"
     y="120"
     fill="#1a1a1a"
     font-weight="600"
     font-size="12px"
     id="text15">Q(v)</text>
  <!-- Old trial points (dimmed) -->
  <circle
     cx="524.13794"
     cy="249.24138"
     r="4"
     fill="#0f6e56"
     opacity="0.35"
     id="circle15" />
  <circle
     cx="651.06897"
     cy="235.79311"
     r="4"
     fill="#0f6e56"
     opacity="0.35"
     id="circle16" />
  <!-- Old cuts (dimmed) -->
  <line
     x1="445.23148"
     y1="152.22287"
     x2="573.32629"
     y2="315.09491"
     stroke="#993c1d"
     stroke-width="0.512016"
     stroke-dasharray="5, 3"
     opacity="0.25"
     id="line16" />
  <line
     x1="604.46924"
     y1="319.92899"
     x2="705.33673"
     y2="146.07199"
     stroke="#993c1d"
     stroke-width="0.457256"
     stroke-dasharray="5, 3"
     opacity="0.25"
     id="line17" />
  <!-- NEW trial point C: near minimum at (585, 302) -->
  <circle
     cx="585"
     cy="302"
     r="5.5"
     fill="#B87333"
     id="circle17" />
  <!-- NEW cut C: tangent near minimum — nearly horizontal.
     slope ≈ -0.05 in SVG (nearly flat, slight negative because just right of minimum)
     y = 302 - 0.05*(x-585) = -0.05x + 331.25
     At x=448: y=308.8  At x=716: y=295.5
-->
  <line
     x1="448"
     y1="309"
     x2="716"
     y2="295"
     stroke="#B87333"
     stroke-width="1.3"
     stroke-dasharray="6,3"
     id="line18" />
  <text
     class="label"
     x="718"
     y="292"
     fill="#B87333"
     id="text18">cut 3</text>
  <!-- New outer approximation: piecewise max of 3 cuts.
     Cut 1 (from left panel, shifted): y = 0.9x + 115.5 → 0.9(x-376) + 115.5 = 0.9x - 222.9
     Wait, I need to recompute for the shifted panel.
     
     Cut 1 shifted: passes through (501,228), slope=0.9 → y = 0.9(x-501)+228 = 0.9x - 222.9
     Cut 2 shifted: passes through (656,232), slope=-0.8 → y = -0.8(x-656)+232 = -0.8x + 756.8  
     Cut 3: y = -0.05x + 331.25
     
     Cut 1 = Cut 3: 0.9x-222.9 = -0.05x+331.25 → 0.95x=554.15 → x≈583, y≈302
     Hmm that's very close to the trial point itself. Let me just fudge the piecewise to look right.
     
     Cut 2 = Cut 3: -0.8x+756.8 = -0.05x+331.25 → -0.75x=-425.55 → x≈567, y≈303
     
     So cut 3 only dominates in a very narrow window (567 to 583). 
     The new approximation is only slightly better than before in the center.
     
     Let me make cut 3 flatter (truly horizontal) and positioned better to show improvement.
     Actually this IS realistic — one cut near the minimum closes the gap there.
     
     Let me just draw the tighter piecewise path by hand:
     From left: follows cut 1, then cut 3 briefly near center, then cut 2.
-->
  <path
     d="m 458.72149,166.82423 106.0932,135.31292 47.43675,-0.76088 82.02709,-137.57748"
     fill="none"
     stroke="#0f6e56"
     stroke-width="2.2"
     stroke-linecap="round"
     id="path18"
     sodipodi:nodetypes="cccc" />
  <!-- Smaller gap -->
  <!-- Legend -->
  <line
     x1="476.82761"
     y1="380.41379"
     x2="502.82761"
     y2="380.41379"
     stroke="#0f6e56"
     stroke-width="2.2"
     id="line19" />
  <text
     class="note"
     x="508.82761"
     y="384.41379"
     font-size="9px"
     id="text20">tighter after one new cut near minimum</text>
  <!-- Bottom annotation -->
  <text
     class="note"
     x="380"
     y="424"
     text-anchor="middle"
     id="text21">Each iteration adds one cut tangent to Q at a visited state. The piecewise-linear outer approximation rises toward Q.</text>
</svg>
