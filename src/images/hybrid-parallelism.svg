  <text
     class="note"
     x="398.34482"
     y="452.06897"
     text-anchor="middle"
     id="text50">Each NUMA domain hosts one MPI rank. Rayon threads within a rank share the same address space.</text>
  <text
     class="note"
     x="398.34482"
     y="466.06897"
     text-anchor="middle"
     id="text51">SharedRegion allows ranks on the same node to share large read-only data (opening tree, case data) without replication.</text>
