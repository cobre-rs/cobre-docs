<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100%"
   viewBox="0 0 720 320"
   version="1.1"
   id="svg24"
   sodipodi:docname="par-stored-vs-computed.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview24"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.5632621"
     inkscape:cx="403.39223"
     inkscape:cy="126.79156"
     inkscape:window-width="3440"
     inkscape:window-height="1371"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg24" />
  <defs
     id="defs1">
    <marker
       id="arr"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="context-stroke"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path1" />
    </marker>
  </defs>
  <style
     id="style1">
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .box-title { font-size: 11px; font-weight: 600; }
  .label { font-size: 10px; fill: #444; }
  .math { font-size: 10.5px; fill: #333; font-family: serif; font-style: italic; }
  .small { font-size: 9px; fill: #666; }
  .note { font-size: 9.5px; fill: #666; font-style: italic; }
</style>
  <text
     class="title"
     x="360"
     y="22"
     text-anchor="middle"
     id="text1">PAR model: stored vs computed quantities</text>
  <!-- Storage Format (left) -->
  <rect
     x="20"
     y="40"
     width="260"
     height="240"
     rx="10"
     fill="#EBF5FB"
     stroke="#4A90B8"
     stroke-width="1"
     id="rect1" />
  <text
     class="box-title"
     x="150"
     y="60"
     text-anchor="middle"
     fill="#2C6D8C"
     id="text2">Storage Format (files on disk)</text>
  <rect
     x="35"
     y="72"
     width="230"
     height="40"
     rx="6"
     fill="#fff"
     stroke="#4A90B8"
     stroke-width="0.5"
     id="rect2" />
  <text
     class="label"
     x="45"
     y="86"
     fill="#2C6D8C"
     font-weight="500"
     id="text3">inflow_seasonal_stats.parquet</text>
  <text
     class="math"
     x="45"
     y="102"
     id="text4">μ_m (mean), s_m (std)</text>
  <rect
     x="35"
     y="120"
     width="230"
     height="66"
     rx="6"
     fill="#fff"
     stroke="#4A90B8"
     stroke-width="0.5"
     id="rect4" />
  <text
     class="label"
     x="45"
     y="134"
     fill="#2C6D8C"
     font-weight="500"
     id="text5">ar_coefficients.parquet</text>
  <text
     class="math"
     x="45"
     y="152"
     id="text6">ψ*_{m,ℓ} (standardized AR coeff)</text>
  <text
     class="math"
     x="45"
     y="168"
     id="text7">σ_m / s_m (residual_std_ratio)</text>
  <text
     class="small"
     x="45"
     y="180"
     id="text8">order p_m = count of rows per group</text>
  <rect
     x="35"
     y="198"
     width="230"
     height="30"
     rx="6"
     fill="#FFF8E1"
     stroke="#F5A623"
     stroke-width="0.5"
     id="rect8" />
  <text
     class="label"
     x="45"
     y="217"
     fill="#8B6914"
     id="text9">User can swap μ_m, s_m for climate scenarios</text>
  <text
     class="small"
     x="150"
     y="258"
     text-anchor="middle"
     fill="#4A90B8"
     id="text10">Scale-invariant: ψ* and ratio</text>
  <text
     class="small"
     x="150"
     y="270"
     text-anchor="middle"
     fill="#4A90B8"
     id="text11">depend only on normalized ρ</text>
  <!-- Conversion arrows -->
  <line
     x1="280"
     y1="100"
     x2="370"
     y2="100"
     stroke="#534AB7"
     stroke-width="2"
     marker-end="url(#arr)"
     id="line11" />
  <line
     x1="280"
     y1="155"
     x2="370"
     y2="155"
     stroke="#534AB7"
     stroke-width="2"
     marker-end="url(#arr)"
     id="line12" />
  <!-- Conversion equations (center) -->
  <rect
     x="296"
     y="72"
     width="58"
     height="20"
     rx="4"
     fill="#EEEDFE"
     stroke="#534AB7"
     stroke-width="0.5"
     id="rect12" />
  <text
     class="small"
     x="325"
     y="85"
     text-anchor="middle"
     fill="#3C3489"
     id="text12">×s_m/s_{m-ℓ}</text>
  <rect
     x="296"
     y="140"
     width="58"
     height="20"
     rx="4"
     fill="#EEEDFE"
     stroke="#534AB7"
     stroke-width="0.5"
     id="rect13" />
  <text
     class="small"
     x="325"
     y="153"
     text-anchor="middle"
     fill="#3C3489"
     id="text13">×s_m</text>
  <!-- Runtime Format (right) -->
  <rect
     x="380"
     y="40"
     width="320"
     height="240"
     rx="10"
     fill="#E1F5EE"
     stroke="#0F6E56"
     stroke-width="1"
     id="rect14" />
  <text
     class="box-title"
     x="540"
     y="60"
     text-anchor="middle"
     fill="#085041"
     id="text14">Runtime Format (in-memory for LP)</text>
  <rect
     x="395"
     y="72"
     width="290"
     height="46"
     rx="6"
     fill="#fff"
     stroke="#0F6E56"
     stroke-width="0.5"
     id="rect15" />
  <text
     class="label"
     x="405"
     y="86"
     fill="#085041"
     font-weight="500"
     id="text15">Original-unit AR coefficients</text>
  <text
     class="math"
     x="405"
     y="104"
     id="text16">ψ_{m,ℓ} = ψ*_{m,ℓ} · s_m / s_{m-ℓ}</text>
  <rect
     x="395"
     y="128"
     width="290"
     height="46"
     rx="6"
     fill="#fff"
     stroke="#0F6E56"
     stroke-width="0.5"
     id="rect16" />
  <text
     class="label"
     x="405"
     y="142"
     fill="#085041"
     font-weight="500"
     id="text17">Residual standard deviation</text>
  <text
     class="math"
     x="405"
     y="160"
     id="text18">σ_m = residual_std_ratio · s_m</text>
  <rect
     x="395"
     y="186"
     width="290"
     height="44"
     rx="6"
     fill="#fff"
     stroke="#0F6E56"
     stroke-width="0.5"
     id="rect18" />
  <text
     class="label"
     x="405"
     y="200"
     fill="#085041"
     font-weight="500"
     id="text19">Base inflow RHS</text>
  <text
     class="math"
     x="405"
     y="218"
     id="text20">b_m = μ_m − Σ_ℓ ψ_{m,ℓ} · μ_{m-ℓ}</text>
  <text
     class="small"
     x="540"
     y="252"
     text-anchor="middle"
     fill="#0F6E56"
     id="text21">Computed once at initialization</text>
  <text
     class="small"
     x="540"
     y="264"
     text-anchor="middle"
     fill="#0F6E56"
     id="text22">→ packed into PrecomputedPar arrays</text>
  <!-- Bottom note -->
  <text
     class="note"
     x="360"
     y="302"
     text-anchor="middle"
     id="text23">Swapping seasonal stats (climate scenarios) changes LP scale but not model structure.</text>
  <text
     class="note"
     x="360"
     y="314"
     text-anchor="middle"
     id="text24">ψ* and residual_std_ratio are invariant — they depend only on normalized autocorrelations ρ.</text>
</svg>
