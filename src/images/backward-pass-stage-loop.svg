<svg width="100%" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .label { font-size: 10.5px; fill: #444; }
  .small { font-size: 9px; fill: #666; }
  .mono { font-size: 9px; font-family: monospace; }
  .note { font-size: 9.5px; fill: #666; font-style: italic; }
</style>

<text class="title" x="360" y="22" text-anchor="middle">Backward pass: per-stage loop with synchronization</text>

<!-- Stage boxes (reverse order, T to 1) -->
<text class="label" x="30" y="56" fill="#888" font-weight="500">for stage t = T, T−1, …, 1:</text>

<!-- Stage T -->
<rect x="30" y="66" width="150" height="200" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="label" x="105" y="86" text-anchor="middle" fill="#712B13" font-weight="600">Stage T</text>

<!-- Trial points distributed -->
<rect x="42" y="96" width="126" height="50" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text class="small" x="105" y="110" text-anchor="middle" fill="#4A1B0C" font-weight="500">Distribute trial points</text>
<text class="small" x="105" y="124" text-anchor="middle" fill="#4A1B0C">across ranks</text>
<text class="small" x="105" y="138" text-anchor="middle" fill="#993C1D">Rank r: trial pts r·M/R..</text>

<!-- Solve all openings -->
<rect x="42" y="152" width="126" height="44" rx="4" fill="#fff" stroke="#993C1D" stroke-width="0.3"/>
<text class="small" x="105" y="166" text-anchor="middle" fill="#333" font-weight="500">Per trial point:</text>
<text class="small" x="105" y="180" text-anchor="middle" fill="#333">Solve N openings → duals</text>
<text class="small" x="105" y="192" text-anchor="middle" fill="#333">→ aggregate → 1 cut</text>

<!-- Sync -->
<rect x="42" y="204" width="126" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="mono" x="105" y="222" text-anchor="middle" fill="#3C3489">allgatherv cuts</text>

<!-- Arrow to stage T-1 -->
<line x1="180" y1="166" x2="218" y2="166" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" stroke="#888"/>
<text class="small" x="198" y="158" fill="#888">cuts →</text>
<text class="small" x="198" y="184" fill="#888">t − 1</text>

<!-- Stage T-1 -->
<rect x="220" y="66" width="150" height="200" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="label" x="295" y="86" text-anchor="middle" fill="#712B13" font-weight="600">Stage T−1</text>

<rect x="232" y="96" width="126" height="50" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text class="small" x="295" y="110" text-anchor="middle" fill="#4A1B0C" font-weight="500">Distribute trial points</text>
<text class="small" x="295" y="124" text-anchor="middle" fill="#4A1B0C">(includes new cuts</text>
<text class="small" x="295" y="138" text-anchor="middle" fill="#4A1B0C">from stage T)</text>

<rect x="232" y="152" width="126" height="44" rx="4" fill="#fff" stroke="#993C1D" stroke-width="0.3"/>
<text class="small" x="295" y="166" text-anchor="middle" fill="#333" font-weight="500">Per trial point:</text>
<text class="small" x="295" y="180" text-anchor="middle" fill="#333">Solve N openings → duals</text>
<text class="small" x="295" y="192" text-anchor="middle" fill="#333">→ aggregate → 1 cut</text>

<rect x="232" y="204" width="126" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="mono" x="295" y="222" text-anchor="middle" fill="#3C3489">allgatherv cuts</text>

<line x1="370" y1="166" x2="408" y2="166" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" stroke="#888"/>

<!-- ... -->
<rect x="410" y="66" width="60" height="200" rx="8" fill="#F5F5F5" stroke="#999" stroke-width="0.5" stroke-dasharray="3,2"/>
<text class="label" x="440" y="170" text-anchor="middle" fill="#888">…</text>

<line x1="470" y1="166" x2="508" y2="166" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" stroke="#888"/>

<!-- Stage 1 -->
<rect x="510" y="66" width="150" height="200" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="label" x="585" y="86" text-anchor="middle" fill="#085041" font-weight="600">Stage 1</text>

<rect x="522" y="96" width="126" height="50" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="small" x="585" y="110" text-anchor="middle" fill="#04342C" font-weight="500">Distribute trial points</text>
<text class="small" x="585" y="124" text-anchor="middle" fill="#04342C">(all previous stage</text>
<text class="small" x="585" y="138" text-anchor="middle" fill="#04342C">cuts available)</text>

<rect x="522" y="152" width="126" height="44" rx="4" fill="#fff" stroke="#0F6E56" stroke-width="0.3"/>
<text class="small" x="585" y="166" text-anchor="middle" fill="#333" font-weight="500">Per trial point:</text>
<text class="small" x="585" y="180" text-anchor="middle" fill="#333">Solve N openings → duals</text>
<text class="small" x="585" y="192" text-anchor="middle" fill="#333">→ aggregate → 1 cut</text>

<rect x="522" y="204" width="126" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="mono" x="585" y="222" text-anchor="middle" fill="#3C3489">allgatherv cuts</text>

<!-- Lower bound evaluation -->
<line x1="585" y1="266" x2="585" y2="290" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)" stroke="#0F6E56"/>
<rect x="500" y="292" width="170" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="label" x="585" y="310" text-anchor="middle" fill="#085041" font-weight="500">Evaluate lower bound</text>

<text class="note" x="360" y="336" text-anchor="middle">Per-stage barrier: all ranks must finish stage t before any rank starts t−1. Cuts propagate backward.</text>
</svg>
