<svg width="100%" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4A90B8" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#4A90B8" stop-opacity="0.40"/>
  </linearGradient>
</defs>
<style>
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
  .bus-label { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
  .var { font-size: 11px; font-family: serif; font-style: italic; fill: #444; }
  .unit-label { font-size: 10px; fill: #666; }
  .eq { font-size: 10px; fill: #534AB7; font-family: serif; }
  .cap { font-size: 9.5px; fill: #888; }
  .note { font-size: 10px; fill: #666; font-style: italic; }
</style>

<text class="title" x="400" y="24" text-anchor="middle">System element overview</text>

<!-- ============ BUS 1 (left) ============ -->
<rect x="100" y="230" width="160" height="10" rx="2" fill="#1a1a1a"/>
<text class="bus-label" x="180" y="224">Bus 1</text>

<!-- Hydro plant connected to Bus 1 -->
<!-- Reservoir -->
<rect x="60" y="60" width="100" height="80" rx="4" fill="url(#water)" stroke="#4A90B8" stroke-width="1"/>
<text class="unit-label" x="110" y="90" text-anchor="middle" fill="#4A90B8" font-weight="500">Reservoir</text>
<text class="var" x="110" y="108" text-anchor="middle">v (hm³)</text>

<!-- Dam wall -->
<path d="M160,60 L165,140" stroke="#4A90B8" stroke-width="3" stroke-linecap="round"/>

<!-- Spillage arc -->
<path d="M155,65 Q180,50 195,70" fill="none" stroke="#8B5E3C" stroke-width="1.5" stroke-dasharray="3,2"/>
<text class="var" x="195" y="58" fill="#8B5E3C">s</text>

<!-- Turbine / generator circle -->
<circle cx="180" cy="170" r="16" fill="#E1F5EE" stroke="#4A90B8" stroke-width="1.5"/>
<text class="var" x="180" y="175" text-anchor="middle" fill="#4A90B8" font-weight="500">H</text>

<!-- Penstock (reservoir → turbine) -->
<line x1="140" y1="140" x2="170" y2="158" stroke="#4A90B8" stroke-width="1.5"/>

<!-- Generation arrow (turbine → bus) -->
<line x1="180" y1="186" x2="180" y2="228" stroke="#4A90B8" stroke-width="1.5" marker-end="url(#arr)" stroke="#4A90B8"/>
<text class="var" x="165" y="210" fill="#4A90B8">q</text>

<!-- Inflow arrow -->
<line x1="40" y1="100" x2="58" y2="100" stroke="#4A90B8" stroke-width="1.5" marker-end="url(#arr)" stroke="#4A90B8"/>
<text class="var" x="26" y="96" fill="#4A90B8">a</text>
<text class="cap" x="14" y="110">(inflow)</text>

<!-- ============ BUS 2 (center) ============ -->
<rect x="330" y="230" width="160" height="10" rx="2" fill="#1a1a1a"/>
<text class="bus-label" x="410" y="224">Bus 2</text>

<!-- Thermal plant connected to Bus 2 -->
<circle cx="410" cy="170" r="16" fill="#FAECE7" stroke="#F5A623" stroke-width="1.5"/>
<text class="var" x="410" y="175" text-anchor="middle" fill="#993C1D" font-weight="500">T</text>

<!-- Flame icon (simplified) -->
<path d="M406,158 Q410,150 414,158" fill="none" stroke="#F5A623" stroke-width="1"/>

<!-- Generation arrow -->
<line x1="410" y1="186" x2="410" y2="228" stroke="#F5A623" stroke-width="1.5" marker-end="url(#arr)" stroke="#F5A623"/>
<text class="var" x="395" y="210" fill="#993C1D">g</text>

<text class="unit-label" x="410" y="148" text-anchor="middle" fill="#993C1D">Thermal</text>
<text class="cap" x="410" y="138" text-anchor="middle">cost: c ($/MWh)</text>

<!-- ============ BUS 3 (right) ============ -->
<rect x="560" y="230" width="160" height="10" rx="2" fill="#1a1a1a"/>
<text class="bus-label" x="640" y="224">Bus 3</text>

<!-- NCS (wind/solar) connected to Bus 3 -->
<circle cx="640" cy="170" r="16" fill="#E1F5EE" stroke="#4A8B6F" stroke-width="1.5"/>
<text class="var" x="640" y="175" text-anchor="middle" fill="#4A8B6F" font-weight="500">W</text>

<!-- Propeller blades -->
<line x1="640" y1="155" x2="640" y2="162" stroke="#4A8B6F" stroke-width="1.2"/>
<line x1="630" y1="175" x2="636" y2="170" stroke="#4A8B6F" stroke-width="1.2"/>
<line x1="650" y1="175" x2="644" y2="170" stroke="#4A8B6F" stroke-width="1.2"/>

<text class="unit-label" x="640" y="148" text-anchor="middle" fill="#4A8B6F">NCS (wind)</text>

<line x1="640" y1="186" x2="640" y2="228" stroke="#4A8B6F" stroke-width="1.5" marker-end="url(#arr)" stroke="#4A8B6F"/>
<text class="var" x="660" y="210" fill="#4A8B6F">r</text>

<!-- ============ TRANSMISSION LINES ============ -->
<!-- Bus 1 → Bus 2 -->
<line x1="260" y1="235" x2="330" y2="235" stroke="#666" stroke-width="2"/>
<text class="var" x="295" y="228">f₁₂</text>
<text class="cap" x="295" y="254" text-anchor="middle">200 MW</text>

<!-- Bus 2 → Bus 3 -->
<line x1="490" y1="235" x2="560" y2="235" stroke="#666" stroke-width="2"/>
<text class="var" x="525" y="228">f₂₃</text>
<text class="cap" x="525" y="254" text-anchor="middle">150 MW</text>

<!-- ============ DEMAND arrows (pointing down from bus) ============ -->
<!-- Bus 1 demand -->
<line x1="140" y1="242" x2="140" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke="#1a1a1a"/>
<text class="var" x="125" y="278">d₁</text>

<!-- Bus 2 demand -->
<line x1="370" y1="242" x2="370" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke="#1a1a1a"/>
<text class="var" x="355" y="278">d₂</text>

<!-- Bus 3 demand -->
<line x1="600" y1="242" x2="600" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke="#1a1a1a"/>
<text class="var" x="585" y="278">d₃</text>

<!-- ============ DEFICIT slack (dashed) ============ -->
<!-- Bus 1 deficit -->
<line x1="220" y1="290" x2="220" y2="242" stroke="#DC4C4C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" stroke="#DC4C4C"/>
<text class="var" x="230" y="278" fill="#DC4C4C">δ₁</text>

<!-- Bus 2 deficit -->
<line x1="450" y1="290" x2="450" y2="242" stroke="#DC4C4C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" stroke="#DC4C4C"/>
<text class="var" x="460" y="278" fill="#DC4C4C">δ₂</text>

<!-- Bus 3 deficit -->
<line x1="680" y1="290" x2="680" y2="242" stroke="#DC4C4C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" stroke="#DC4C4C"/>
<text class="var" x="690" y="278" fill="#DC4C4C">δ₃</text>

<!-- ============ LOAD BALANCE EQUATION ============ -->
<rect x="120" y="330" width="560" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="eq" x="400" y="352" text-anchor="middle" font-size="12px">Load balance at each bus b, block k:</text>
<text class="eq" x="400" y="372" text-anchor="middle" font-size="11.5px">Σ generation + Σ imports − Σ exports + deficit − demand = 0</text>

<!-- ============ VARIABLE LEGEND ============ -->
<rect x="120" y="410" width="560" height="90" rx="8" fill="#F8F8F8" stroke="#DDD" stroke-width="0.5"/>
<text class="unit-label" x="140" y="430" font-weight="500" fill="#1a1a1a">Variables</text>

<circle cx="150" cy="448" r="4" fill="#4A90B8"/><text class="cap" x="160" y="452">v = storage (hm³), q = hydro gen (MW), a = inflow (m³/s), s = spillage (m³/s)</text>
<circle cx="150" cy="468" r="4" fill="#F5A623"/><text class="cap" x="160" y="472">g = thermal gen (MW), c = marginal cost ($/MWh)</text>
<circle cx="150" cy="488" r="4" fill="#4A8B6F"/><text class="cap" x="160" y="492">r = NCS gen (MW), f = flow (MW), d = demand (MW), δ = deficit slack (MW)</text>
</svg>
