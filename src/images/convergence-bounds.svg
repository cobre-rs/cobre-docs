<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .axis { font-size: 10px; fill: #888; }
  .label { font-size: 10.5px; fill: #444; }
  .small { font-size: 9px; fill: #666; }
  .note { font-size: 9.5px; fill: #666; font-style: italic; }
</style>

<text class="title" x="340" y="22" text-anchor="middle">Convergence: lower and upper bound evolution</text>

<!-- Axes -->
<line x1="70" y1="280" x2="630" y2="280" stroke="#999" stroke-width="0.8"/>
<line x1="70" y1="280" x2="70" y2="40" stroke="#999" stroke-width="0.8"/>
<text class="axis" x="350" y="306" text-anchor="middle">Iteration k</text>
<text class="axis" x="25" y="160" text-anchor="middle" transform="rotate(-90,25,160)">Total expected cost</text>

<!-- Iteration tick marks -->
<line x1="120" y1="280" x2="120" y2="284" stroke="#999" stroke-width="0.5"/>
<text class="axis" x="120" y="296" text-anchor="middle">1</text>
<line x1="210" y1="280" x2="210" y2="284" stroke="#999" stroke-width="0.5"/>
<text class="axis" x="210" y="296" text-anchor="middle">5</text>
<line x1="300" y1="280" x2="300" y2="284" stroke="#999" stroke-width="0.5"/>
<text class="axis" x="300" y="296" text-anchor="middle">10</text>
<line x1="390" y1="280" x2="390" y2="284" stroke="#999" stroke-width="0.5"/>
<text class="axis" x="390" y="296" text-anchor="middle">15</text>
<line x1="480" y1="280" x2="480" y2="284" stroke="#999" stroke-width="0.5"/>
<text class="axis" x="480" y="296" text-anchor="middle">20</text>
<line x1="570" y1="280" x2="570" y2="284" stroke="#999" stroke-width="0.5"/>
<text class="axis" x="570" y="296" text-anchor="middle">25</text>

<!-- Upper bound (decreasing, noisy) with confidence band -->
<path d="M120,85 L150,105 L180,90 L210,110 L240,100 L270,120 L300,125 L330,128 L360,135 L390,140 L420,145 L450,148 L480,150 L510,152 L540,155 L570,156" fill="none" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.4"/>
<path d="M120,60 L150,75 L180,65 L210,80 L240,72 L270,88 L300,92 L330,95 L360,100 L390,104 L420,108 L450,110 L480,112 L510,114 L540,116 L570,118" fill="none" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.4"/>
<!-- UB mean line -->
<path d="M120,72 L150,90 L180,78 L210,95 L240,86 L270,104 L300,108 L330,112 L360,118 L390,122 L420,126 L450,129 L480,131 L510,133 L540,136 L570,137" fill="none" stroke="#993C1D" stroke-width="2"/>
<!-- Confidence band fill -->
<path d="M120,60 L150,75 L180,65 L210,80 L240,72 L270,88 L300,92 L330,95 L360,100 L390,104 L420,108 L450,110 L480,112 L510,114 L540,116 L570,118 L570,156 L540,155 L510,152 L480,150 L450,148 L420,145 L390,140 L360,135 L330,128 L300,125 L270,120 L240,100 L210,110 L180,90 L150,105 L120,85 Z" fill="#993C1D" fill-opacity="0.08"/>

<!-- Lower bound (monotonically increasing) -->
<path d="M120,260 L150,245 L180,230 L210,210 L240,190 L270,175 L300,162 L330,152 L360,145 L390,140 L420,136 L450,134 L480,132 L510,131 L540,130 L570,130" fill="none" stroke="#0F6E56" stroke-width="2.5"/>

<!-- Gap annotation -->
<line x1="300" y1="108" x2="300" y2="162" stroke="#534AB7" stroke-width="1" stroke-dasharray="3,2"/>
<text class="small" x="308" y="138" fill="#534AB7" font-weight="500">gap</text>

<!-- Convergence point -->
<line x1="540" y1="130" x2="540" y2="136" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="540" cy="133" r="6" fill="none" stroke="#534AB7" stroke-width="1.5"/>
<text class="small" x="548" y="148" fill="#534AB7" font-weight="500">converged</text>

<!-- Labels -->
<text class="label" x="580" y="134" fill="#993C1D" font-weight="500">UB (Monte Carlo)</text>
<text class="label" x="580" y="128" fill="#0F6E56" font-weight="500">LB (monotone ↑)</text>

<!-- Legend -->
<line x1="80" y1="320" x2="110" y2="320" stroke="#0F6E56" stroke-width="2.5"/>
<text class="small" x="115" y="324">Lower bound — monotonically non-decreasing (adding cuts only raises it)</text>

<line x1="380" y1="320" x2="410" y2="320" stroke="#993C1D" stroke-width="2"/>
<text class="small" x="415" y="324">Upper bound — Monte Carlo estimate with confidence band</text>

<text class="note" x="340" y="340" text-anchor="middle">Stopping rule triggers when gap = (UB − LB) / max(1, |UB|) ≤ tolerance, or stall/iteration limit.</text>
</svg>
