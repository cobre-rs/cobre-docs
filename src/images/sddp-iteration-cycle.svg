<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100%"
   viewBox="0 0 720 560"
   version="1.1"
   id="svg31"
   sodipodi:docname="sddp-iteration-cycle.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview31"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.0714286"
     inkscape:cx="351.44828"
     inkscape:cy="263.10345"
     inkscape:window-width="3440"
     inkscape:window-height="1371"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg31" />
  <defs
     id="defs2">
    <marker
       id="arr"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto-start-reverse">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="context-stroke"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path1" />
    </marker>
    <marker
       id="arr-w"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto-start-reverse">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="#999"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path2" />
    </marker>
  </defs>
  <style
     id="style2">
  text { font-family: system-ui, sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
  .phase { font-size: 14px; font-weight: 600; }
  .desc { font-size: 11px; fill: #444; }
  .detail { font-size: 10px; fill: #666; }
  .mpi { font-size: 9.5px; fill: #534AB7; font-weight: 500; }
  .iter { font-size: 11px; fill: #888; font-style: italic; }
</style>
  <!-- Title -->
  <text
     class="title"
     x="360"
     y="28"
     text-anchor="middle"
     id="text2">SDDP iteration cycle</text>
  <text
     class="iter"
     x="360"
     y="46"
     text-anchor="middle"
     id="text3">Each iteration refines the policy — repeat until convergence</text>
  <!-- === FORWARD PASS (top) === -->
  <rect
     x="195"
     y="68"
     width="330"
     height="140"
     rx="16"
     fill="#E1F5EE"
     stroke="#0F6E56"
     stroke-width="1"
     id="rect3" />
  <text
     class="phase"
     x="360"
     y="94"
     text-anchor="middle"
     fill="#085041"
     id="text4">1. Forward Pass</text>
  <text
     class="desc"
     x="215"
     y="116"
     id="text5">Sample M scenario trajectories through stages 1…T</text>
  <text
     class="desc"
     x="215"
     y="134"
     id="text6">Solve stage LPs using current cut approximation</text>
  <text
     class="desc"
     x="215"
     y="152"
     id="text7">Record trial points (visited states) at each stage</text>
  <text
     class="desc"
     x="215"
     y="170"
     id="text8">Collect stage costs → upper bound estimate</text>
  <rect
     x="215"
     y="180"
     width="290"
     height="18"
     rx="4"
     fill="#EEEDFE"
     stroke="#534AB7"
     stroke-width="0.5"
     id="rect8" />
  <text
     class="mpi"
     x="360"
     y="193"
     text-anchor="middle"
     id="text9">MPI: allgatherv trial points + costs across ranks</text>
  <!-- === BACKWARD PASS (right) === -->
  <rect
     x="415.17242"
     y="248.68965"
     width="280"
     height="170"
     rx="16"
     fill="#faece7"
     stroke="#993c1d"
     stroke-width="1"
     id="rect9" />
  <text
     class="phase"
     x="555.17242"
     y="274.68967"
     text-anchor="middle"
     fill="#712b13"
     id="text10">2. Backward Pass</text>
  <text
     class="desc"
     x="435.17242"
     y="296.68967"
     id="text11">For stages T down to 1:</text>
  <text
     class="desc"
     x="445.17242"
     y="314.68967"
     id="text12">Evaluate ALL N openings at each trial point</text>
  <text
     class="desc"
     x="445.17242"
     y="332.68967"
     id="text13">Extract duals → cut coefficients (π, α)</text>
  <text
     class="desc"
     x="445.17242"
     y="350.68967"
     id="text14">Aggregate into single Benders cut</text>
  <text
     class="desc"
     x="445.17242"
     y="368.68967"
     id="text15">Add cut to previous stage's LP</text>
  <rect
     x="435.17242"
     y="380.68967"
     width="240"
     height="28"
     rx="4"
     fill="#eeedfe"
     stroke="#534ab7"
     stroke-width="0.5"
     id="rect15" />
  <text
     class="mpi"
     x="555.17242"
     y="393.68967"
     text-anchor="middle"
     id="text16">MPI: allgatherv cuts per stage</text>
  <text
     class="mpi"
     x="555.17242"
     y="405.68967"
     text-anchor="middle"
     id="text17">(each rank contributes its trial-point cuts)</text>
  <!-- === CONVERGENCE CHECK (left) === -->
  <rect
     x="9.3793106"
     y="241.44827"
     width="280"
     height="170"
     rx="16"
     fill="#eeedfe"
     stroke="#534ab7"
     stroke-width="1"
     id="rect17" />
  <text
     class="phase"
     x="149.3793"
     y="267.44827"
     text-anchor="middle"
     fill="#3c3489"
     id="text18">3. Stopping Rule Check</text>
  <text
     class="desc"
     x="29.379311"
     y="289.44827"
     id="text19">Evaluate lower bound from stage-0 LP:</text>
  <text
     class="detail"
     x="39.379311"
     y="307.44827"
     font-family="serif"
     font-style="italic"
     id="text20">LB = ρ₀[ Q₀(x₀, ω) | ω ∈ Ω₀ ]</text>
  <text
     class="desc"
     x="29.379311"
     y="329.44827"
     id="text21">Compute gap = (UB − LB) / max(1, |UB|)</text>
  <text
     class="desc"
     x="29.379311"
     y="347.44827"
     id="text22">Check stopping rules:</text>
  <text
     class="detail"
     x="39.379311"
     y="365.44827"
     id="text23">• gap ≤ tolerance?</text>
  <text
     class="detail"
     x="39.379311"
     y="381.44827"
     id="text24">• iteration limit reached?</text>
  <text
     class="detail"
     x="39.379311"
     y="397.44827"
     id="text25">• stall detection triggered?</text>
  <!-- === ARROWS connecting the three phases === -->
  <!-- Forward → Backward (right side, downward) -->
  <path
     d="m 521.54886,200.52806 q 40.22165,17.22243 54.8477,46.97026"
     fill="none"
     stroke="#888888"
     stroke-width="1.51326"
     marker-end="url(#arr-w)"
     id="path25" />
  <text
     class="detail"
     x="562.48279"
     y="220.51724"
     fill="#888"
     id="text26">trial points</text>
  <!-- Backward → Convergence (bottom, leftward) -->
  <path
     d="m 414.63843,401.65254 q -76.64234,51.24405 -125.80083,4.26062"
     fill="none"
     stroke="#888888"
     stroke-width="2"
     marker-end="url(#arr-w)"
     id="path26" />
  <text
     class="detail"
     x="315.55173"
     y="443.13794"
     fill="#888"
     id="text27">new cuts added</text>
  <!-- Convergence → Forward (left side, upward, "not converged") -->
  <path
     d="M 119.9341,241.51146 Q 69.825649,210.77465 195.09678,129.8883"
     fill="none"
     stroke="#0f6e56"
     stroke-width="2"
     marker-end="url(#arr)"
     id="path27" />
  <text
     class="detail"
     x="56.620689"
     y="167.51724"
     fill="#0F6E56"
     font-weight="500"
     id="text28">not stopped</text>
  <text
     class="detail"
     x="54.689655"
     y="180.06897"
     fill="#0F6E56"
     id="text29">→ next iteration</text>
  <!-- Convergence → STOP (down from convergence box) -->
  <line
     x1="144.06897"
     y1="413.3793"
     x2="144.06897"
     y2="447.31369"
     stroke="#993c1d"
     stroke-width="1.37304"
     marker-end="url(#arr)"
     id="line29" />
  <rect
     x="84.55172"
     y="449.17239"
     width="120"
     height="36"
     rx="8"
     fill="#fff0ed"
     stroke="#993c1d"
     stroke-width="1"
     id="rect29" />
  <text
     class="phase"
     x="144.55173"
     y="472.17239"
     text-anchor="middle"
     fill="#993c1d"
     id="text30">Stopped</text>
  <!-- Iteration counter -->
  <rect
     x="278.06897"
     y="449.10345"
     width="140"
     height="32"
     rx="6"
     fill="#f8f8f8"
     stroke="#cccccc"
     stroke-width="0.5"
     id="rect30" />
  <text
     class="iter"
     x="348.06897"
     y="469.10345"
     text-anchor="middle"
     id="text31">k ← k + 1</text>
</svg>
