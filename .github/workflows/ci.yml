name: CI

on:
  # CUTOVER (2026-06-25): mdBook CI stood down. starlight-ci.yml is now the PR gate;
  # this mdBook CI is removed entirely at decommission. Kept as a manual
  # workflow_dispatch lever during the rollback window.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: "0.5.2"

      - name: Install mdbook-katex
        run: |
          curl -fsSL https://github.com/lzanini/mdbook-katex/releases/download/0.10.0-alpha-binaries/mdbook-katex-v0.10.0-alpha-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook-katex
          sudo mv mdbook-katex /usr/local/bin/

      - name: Install mdbook-mermaid
        run: |
          curl -fsSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook-mermaid
          sudo mv mdbook-mermaid /usr/local/bin/

      - name: Build book
        run: mdbook build

      - name: Check for broken links
        run: mdbook test
