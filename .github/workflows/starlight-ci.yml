# Starlight site CI — PR verification for the Astro/Starlight docs in site/.
#
# This is the verification half of the new pipeline (E7). It installs Node + a
# pinned d2 binary, runs the test suite, builds the multi-version site, and runs
# the corpus quality gates (figures, astro check, math-parity, link-check). It
# does NOT deploy — no Pages artifact, no CNAME, no pages:/id-token: permissions
# (that is ticket-026). It is additive and does NOT touch the live mdBook
# ci.yml / deploy.yml.
#
# ──────────────────────────────────────────────────────────────────────────────
# Manual run & verify (for the maintainer — NOT performed by the author):
#   1. (Recommended) Lint locally:  actionlint .github/workflows/starlight-ci.yml
#   2. The workflow is committed on feat/starlight-migration (done by the author).
#   3. Push the branch and open/refresh a PR to main; GitHub Actions runs
#      `Starlight CI` automatically (no repo-settings change needed for a CI
#      workflow using the default read-only GITHUB_TOKEN — Actions is already
#      enabled, as the mdBook ci.yml runs).
#   4. Or trigger it manually from the Actions tab via the workflow_dispatch
#      button once the branch is pushed.
#   5. Confirm the run is green: `d2 --version` prints v0.7.1, check:figures and
#      `npm run build:versions` complete, then `npm test` passes (it is dist-gated,
#      so it runs after the build), and check / check:math / check:links all pass.
#      (Counts grow with version snapshots — the scripts assert lower bounds;
#      nothing is hard-coded here.)
# ──────────────────────────────────────────────────────────────────────────────

name: Starlight CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref (e.g. a force-push to an open PR).
concurrency:
  group: starlight-ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this is a verification-only workflow (no deploy, no Pages).
# Lock the job token to read-only so it cannot publish even if the repo's default
# Actions permission is "read and write" (mirrors starlight-staging.yml).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Astro project lives in site/, not the repo root. Run every `run:` step
    # there once instead of `cd site` per step. NB: setup-node's cache option
    # keys cache-dependency-path off the REPO ROOT regardless, so that path stays
    # `site/package-lock.json` below.
    defaults:
      run:
        working-directory: .

    steps:
      # fetch-depth: 0 — Lunaria (the /lunaria dashboard) reads each content file's
      # git history; a shallow clone makes the Starlight build fail with "could not
      # retrieve last commit data". Full history is required.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: package-lock.json

      # astro-d2 shells out to a `d2` executable that must be on PATH at build
      # time, or D2 fenced blocks silently render nothing. Install a PINNED
      # release asset (reproducible) — NOT `curl … d2lang.com/install.sh | sh`
      # (the banned, unpinned curl|bash pattern). Mirrors ci.yml's
      # binary-then-`sudo mv` style.
      # sha256 pinned: d2 v0.7.1 ships no checksums file, so this hash was
      # computed from the released linux-amd64 asset. A tampered or replaced
      # tarball fails `sha256sum -c` and aborts the step before extraction.
      - name: Install d2 (pinned 0.7.1, sha256-verified)
        run: |
          d2_tarball=d2-v0.7.1-linux-amd64.tar.gz
          d2_sha256=eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v0.7.1/${d2_tarball}" -o "${d2_tarball}"
          echo "${d2_sha256}  ${d2_tarball}" | sha256sum -c -
          tar xzf "${d2_tarball}"
          sudo mv d2-v0.7.1/bin/d2 /usr/local/bin/d2
          sudo chmod +x /usr/local/bin/d2

      # Print the pinned version so a silent install failure surfaces here,
      # before the build, instead of as confusing "missing figures" output.
      - name: Verify d2
        run: d2 --version

      - name: Install dependencies
        run: npm ci

      # E10 ticket-031: regenerate the third-party notices file and fail if
      # the committed copy is stale (drift guard). Uses permissions: contents: read
      # — no push, no auto-commit. Maintainer must run `npm run gen:notices` and
      # commit the result when deps change.
      - name: Notices drift guard
        run: |
          npm run gen:notices
          git diff --exit-code -- public/THIRD-PARTY-NOTICES.txt

      - name: Check figures (dependency guard)
        run: npm run check:figures

      # Epic 04 ticket-015: the two-voice methodology gates, ported from
      # cobre's scripts/ci/check_doc_voice.py / check_doc_counts.py /
      # check_book_version.py. Static source-reading checks (no build needed),
      # so they run pre-build alongside check:figures. Pre-existing strict-zone
      # hits are grandfathered in scripts/doc-lint-allow.txt; check:voice and
      # check:version fail only on a NEW, un-allowlisted violation.
      - name: Check doc voice (two-voice hype/unpinned-number gate)
        run: npm run check:voice

      - name: Check doc counts (column/field count vs adjacent table)
        run: npm run check:counts

      - name: Check doc version (cobre-version references vs the Synced-to anchor)
        run: npm run check:version

      # ticket-014 (strategy §6b): advisory vendored-JSON-schema validation.
      # Asserts the COMMITTED public/schemas/ copy is present, exactly 18
      # files, and every file is well-formed JSON. This needs NO `cobre`
      # checkout — it is a static-metadata check like check:figures/check:d2.
      # The tag-drift check (`npm run refresh:schemas -- --check`, which DOES
      # need a `cobre` checkout) stays a local/maintainer action; the
      # authoritative freshness gate stays in `cobre` (ticket-016).
      - name: Check vendored JSON schemas (count + parse)
        run: |
          node -e '
            const { readdirSync, readFileSync } = require("node:fs");
            const files = readdirSync("public/schemas").filter((f) => f.endsWith(".schema.json"));
            if (files.length !== 18) {
              console.error("check:schemas: expected 18 vendored schema files, found " + files.length);
              process.exit(1);
            }
            for (const f of files) {
              JSON.parse(readFileSync("public/schemas/" + f, "utf8"));
            }
            console.log("check:schemas: " + files.length + " vendored schemas present and well-formed");
          '

      # E10 ticket-032 (licensing.md item 3): assert D2 uses ELK, never the
      # proprietary TALA engine (unlicensed TALA watermarks output). A static
      # source grep of astro.config.mjs + ```d2 blocks under src/ — pre-build,
      # like check:figures.
      - name: Check D2 layout (no TALA)
        run: npm run check:d2

      # E10 ticket-035 (licensing.md item 7): SPDX audit gate. Reads the declared
      # deps' installed `license` fields and fails if any is outside the permissive
      # allow-list and not the d2/ELK build-time-only exemption — the automated
      # guard protecting the "100% FOSS" claim / E8 cutover gate. Static metadata
      # check, pre-build like check:figures/check:d2; needs node_modules (npm ci ran).
      - name: Check SPDX licenses (FOSS guard)
        run: npm run check:spdx

      - name: Build (multi-version assembly)
        run: npm run build:versions

      # `npm test` MUST run AFTER the build: the scripts/*.test.mjs glob includes
      # dist-gated tests (i18n-locale, version-assembly) that read dist/index.html
      # and exit non-zero ("run npm run build first") when dist/ is absent. On a
      # clean runner there is no dist/ until build:versions runs. (check:figures
      # stays pre-build — it reads src/, not dist/.) Keep the single glob'd
      # invocation so new tests are picked up automatically.
      - name: Test (compute layer + scripts)
        run: npm test

      - name: Check (astro check)
        run: npm run check

      - name: Check math parity
        run: npm run check:math

      - name: Check links
        run: npm run check:links
